
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watch your selected movie on Movie Mint.">
    <title>Movie Player | Movie Mint</title>

    <link rel="stylesheet" href="assets/css/polish.css">
    <link rel="stylesheet" href="assets/css/storage.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/player.css">
</head>
<body>
    <header id="site-header"></header>

    <main class="page-main player-page">
        <nav class="player-breadcrumb" aria-label="Breadcrumb">
            <a href="index.html">Home</a>
            <span aria-hidden="true">/</span>
            <a href="movies.html">Movies</a>
            <span aria-hidden="true">/</span>
            <span id="player-breadcrumb-title">Player</span>
        </nav>

        <section class="player-heading">
            <div>
                <p class="eyebrow">MOVIE MINT PLAYER</p>
                <h1 id="player-title">Loading movie...</h1>
                <p id="player-subtitle" class="player-subtitle">
                    Preparing your video
                </p>
            </div>

            <a id="back-to-details" class="player-back-link" href="movies.html">
                ← Movie details
            </a>
        </section>

        <section class="video-shell" aria-label="Movie video player">
            <div id="player-message" class="player-message" role="status">
                <p>Loading your movie...</p>
            </div>

            <video
                id="movie-video"
                class="movie-video"
                controls
                playsinline
                preload="metadata"
                aria-label="Movie playback"
            >
                Your browser does not support HTML5 video.
            </video>
        </section>

        <section class="player-toolbar" aria-label="Additional playback controls">
            <div class="player-status">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="playback-status">Waiting for video</span>
            </div>

            <div class="player-tools">
                <label for="playback-speed">Playback speed</label>
                <select id="playback-speed">
                    <option value="0.5">0.5×</option>
                    <option value="0.75">0.75×</option>
                    <option value="1" selected>Normal</option>
                    <option value="1.25">1.25×</option>
                    <option value="1.5">1.5×</option>
                    <option value="1.75">1.75×</option>
                    <option value="2">2×</option>
                </select>

                <button id="fullscreen-button" type="button">
                    Fullscreen
                </button>
                
                <button id="download-movie-button"
                        type="button"
                        data-download-current="true">
                    Download Movie
                </button>

            </div>
        </section>

        
        <p id="download-status"
        class="download-status"
        role="status"
        aria-live="polite"></p>


        <section class="player-information">
            <h2>About this movie</h2>
            <p id="player-description">
                Movie information will appear here.
            </p>
            <div id="player-genres" class="player-genres"></div>
        </section>
    </main>

    <footer id="site-footer"></footer>


    <script src="assets/js/components/header.js" defer></script>
    <script src="assets/js/components/footer.js" defer></script>
    <script src="assets/js/data/movies.js" defer></script>
    <script src="assets/js/storage.js" defer></script>
    <script src="assets/js/storage-ui.js" defer></script>
    <script src="assets/js/download.js" defer></script>
    <script src="assets/js/player.js" defer></script>
    <script src="assets/js/main.js" defer></script>

</body>
</html>
